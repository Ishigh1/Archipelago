## Quicksand transition
09/0C67/: |
  add a,a
  ld hl,@warpDestLocations
  rst 10  ; rst_addAToHL
  ld bc,wWarpDestGroup
  ldi a,(hl)
  ld (bc),a
  inc c ; wWarpDestRoom
  ldi a,(hl)
  ld (bc),a
  inc c ; wWarpTransition
  ldi a,(hl)
  ld (bc),a
  inc c ; wWarpDestPos
  ld a,(hl)
  ld (bc),a
  inc c ; wWarpTransition2
  ld a,$03 ; Fadeout
  ld (bc),a
  jp interactionDelete

  @warpDestLocations: ; group, room, transition, position
  db $85,$d0,$05,$57
  db $85,$d1,$05,$57
  db $85,$d2,$05,$57
  db $84,$f4,$05,$27

