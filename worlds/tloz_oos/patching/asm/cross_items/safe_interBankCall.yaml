# interBankCall, but doesn't use af. Slower though.
00//safe_interBankCall: |
  ld ($c018),a ; use a sound buffer to keep the value
  ld a,($ff97)
  push af
  ld a,e
  ld ($ff97),a
  ld ($2222),a
  ld a,($c018)
  call $00a0
  ld ($c018),a ; use a sound buffer to keep the value
  pop hl
  ld a,h
  ld ($ff97),a
  ld ($2222),a
  ld a,($c018)
  ret